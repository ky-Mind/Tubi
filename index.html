<body>
<div id="app"></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-label="Menu Tubi">
  <div class="drawer-head"><div class="brand"><img src="./tubi-icon.png" alt="Tubi">tubi</div><button class="close" id="closeDrawer" aria-label="Tutup menu">×</button></div>
  <div class="drawer-links" id="drawerLinks"></div>
  <div class="drawer-tools">
    <button class="drawer-tool" id="themeToggle"><span class="tool-icon" id="themeIcon"></span><span>Mode tampilan</span><strong id="themeLabel">Terang</strong></button>
    <button class="drawer-tool" id="installBtn" style="display:none"><span class="tool-icon"></span><span>Pasang Tubi</span><strong>Install</strong></button>
  </div>
</aside>
<div class="modal-backdrop" id="cartBackdrop"><div class="modal" id="cartModal"></div></div>
<div class="modal-backdrop" id="productBackdrop"><div class="modal" id="productModal"></div></div>
<div class="modal-backdrop" id="loginBackdrop"><div class="modal" id="loginModal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBX6gj6mboRztlrF9ILRXD1gnHHIB94Bqo",
  authDomain:"tubi-app.firebaseapp.com",
  projectId:"tubi-app",
  storageBucket:"tubi-app.firebasestorage.app",
  messagingSenderId:"492656969625",
  appId:"1:492656969625:web:3bdcd40350d28241b53508",
  measurementId:"G-311K0RXQDF"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const google = new GoogleAuthProvider();
google.setCustomParameters({prompt:"select_account"});

const ADMIN_EMAILS = ["Hilmykia@gmail.com"];
const ADMIN_EMAIL = ADMIN_EMAILS[0];
const normalizedEmail = value => String(value || "").trim().toLowerCase();
const emailIsFixedAdmin = email => ADMIN_EMAILS.some(item => normalizedEmail(item) === normalizedEmail(email));
const FALLBACK_PRODUCTS = [
  {id:"default-roti",name:"Roti Kukus Thailand",price:5000,rating:4.9,category:"Roti",emoji:"Tubi",image:"./assets/roti-kukus.png",description:"Roti kukus lembut dengan pilihan rasa coklat crunchy, matcha, keju, blueberry, strawberry, dan abon."},
  {id:"default-dimsum-chili",name:"Dimsum Chili Oil",price:15000,rating:4.9,category:"Dimsum",emoji:"Tubi",image:"./assets/dimsum-chili.png",description:"Dimsum 5 pcs dengan chili oil khas Tubi."},
  {id:"default-dimsum-goreng",name:"Dimsum Goreng",price:10000,rating:4.8,category:"Dimsum",emoji:"Tubi",image:"./assets/dimsum-goreng.png",description:"Dimsum goreng 2 pcs, cocok untuk camilan gurih."},
  {id:"default-topokki",name:"Topokki Sosis & Odeng",price:10000,rating:4.9,category:"Topokki",emoji:"Tubi",image:"./assets/topokki.png",description:"Topokki dengan pilihan sosis dan odeng, saus gurih pedas."},
  {id:"default-kwetiau",name:"Kwetiau Goreng Pangsit",price:12000,rating:4.8,category:"Kwetiau",emoji:"Tubi",image:"./assets/kwetiau.png",description:"Kwetiau goreng lengkap dengan pangsit dan topping pilihan."},
  {id:"default-cilok",name:"Cilok dan Tahu",price:10000,rating:4.8,category:"Cilok",emoji:"Tubi",image:"./assets/cilok.png",description:"Cilok dan tahu dalam porsi praktis, tersedia original atau mix."},
  {id:"default-mambo",name:"Es Mambo Susu",price:2000,rating:4.9,category:"Minuman",emoji:"Tubi",image:"./assets/es-mambo.png",description:"Es mambo susu aneka rasa, segar dan cocok diminum kapan saja."}
];
const CATS = [["Roti","Roti"],["Dimsum","Dimsum"],["Topokki","Topokki"],["Kwetiau","Kwetiau"],["Cilok","Cilok"],["Minuman","Minuman"]];

const state = {
  user:null, profile:null, isAdmin:false, view:"home", q:"", cat:"Semua",
  products:[], orders:[], favorites:JSON.parse(localStorage.getItem("tubi_favorites")||"[]"),
  cart:JSON.parse(localStorage.getItem("tubi_cart")||"[]"), productsUnsub:null, ordersUnsub:null, adminOrdersUnsub:null,
  editingProduct:null,
  adminEmails:[],
  profileSaving:false, theme:localStorage.getItem("tubi_theme")||((window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"), installPrompt:null, location:null
};
const $=s=>document.querySelector(s);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const isAdmin=()=>!!state.user && state.isAdmin===true;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),2500)}
function saveLocal(){localStorage.setItem("tubi_cart",JSON.stringify(state.cart));localStorage.setItem("tubi_favorites",JSON.stringify(state.favorites))}
function productById(id){return state.products.find(p=>p.id===id)||FALLBACK_PRODUCTS.find(p=>p.id===id)}

function svg(name,size=24){
  const paths={
    menu:`<path d="M4 7h16M4 12h16M4 17h16"/>`,
    cart:`<path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>`,
    home:`<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>`,
    orders:`<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>`,
    heart:`<path d="M20.8 8.8c0 5.1-8.8 10-8.8 10s-8.8-4.9-8.8-10A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.4Z"/>`,
    user:`<circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>`,
    search:`<circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/>`,
    grid:`<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>`,
    image:`<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 5 5"/>`,
    edit:`<path d="m4 20 4.2-1 9.6-9.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m13.8 7.2 3 3"/>`,
    trash:`<path d="M4 7h16M10 11v6M14 11v6M7 7l1 13h8l1-13M9 4h6"/>`,
    plus:`<path d="M12 5v14M5 12h14"/>`,
    logout:`<path d="M10 5H5v14h5M14 8l4 4-4 4M10 12h8"/>`,
    check:`<path d="m5 12 4 4L19 6"/>`,
    location:`<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>`,
    star:`<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9L12 3Z"/>`,
    sun:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>`,
    moon:`<path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5 8.5 8.5 0 1 0 20.5 14.7Z"/>`,
    download:`<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>`,
    map:`<path d="M9 18 4 21V6l5-3 6 3 5-3v15l-5 3-6-3Z"/><path d="M9 3v15M15 6v15"/>`
  };
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.grid}</svg>`;
}
function googleIcon(){
  return `<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.7-.06-1.37-.18-2H12v3.79h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.22c1.89-1.74 2.99-4.3 2.99-7.32Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.45l-3.22-2.51c-.9.6-2.04.96-3.39.96-2.61 0-4.83-1.76-5.62-4.13H3.05v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.38 13.87A6 6 0 0 1 6.06 12c0-.65.11-1.28.32-1.87V7.54H3.05A10 10 0 0 0 2 12c0 1.61.38 3.13 1.05 4.46l3.33-2.59Z"/><path fill="#EA4335" d="M12 5.99c1.47 0 2.79.51 3.83 1.51l2.87-2.87C16.95 3.03 14.7 2 12 2a10 10 0 0 0-8.95 5.54l3.33 2.59C7.17 7.76 9.39 5.99 12 5.99Z"/></svg>`;
}
function categoryIcon(cat){ return cat==="Ayam"?svg("star",28):cat==="Paket"?svg("grid",28):cat==="Mie"?svg("orders",28):svg("grid",28); }
function imageHtml(p,cls="product-img"){
  const src=typeof p?.image==="string" && /^(data:image|https?:\/\/|\.\/|\/)/.test(p.image) ? p.image : "";
  return src?`<div class="${cls}"><img src="${src}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<span class="product-emoji">${svg("image",52)}</span>'"></div>`:`<div class="${cls}"><span class="product-emoji">${svg("image",52)}</span></div>`;
}
function statusClass(s){return String(s||"baru").toLowerCase().replace(/\s/g,"-")}
function timeText(ts){if(!ts)return "Baru saja";try{return new Intl.DateTimeFormat("id-ID",{dateStyle:"medium",timeStyle:"short"}).format(ts.toDate())}catch{return "Baru saja"}}


function applyTheme(){
  document.body.classList.toggle("dark",state.theme==="dark");
  document.documentElement.style.colorScheme=state.theme;
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",state.theme==="dark"?"#15181c":"#ed1b2f");
  localStorage.setItem("tubi_theme",state.theme);
  const label=document.getElementById("themeLabel");
  const icon=document.getElementById("themeIcon");
  if(label)label.textContent=state.theme==="dark"?"Gelap":"Terang";
  if(icon)icon.innerHTML=svg(state.theme==="dark"?"moon":"sun",19);
}
function renderDrawer(){
  const links=document.getElementById("drawerLinks");
  if(!links)return;
  const items=[
    ["home","home","Beranda"],
    ["orders","orders","Pesanan saya"],
    ["favorites","heart","Favorit"],
    ["profile","user","Profil"]
  ];
  if(isAdmin())items.push(["admin","grid","Dashboard Admin"]);
  links.innerHTML=items.map(([v,icon,label])=>`<button data-view="${v}" class="${state.view===v?"active":""}">${svg(icon,19)} ${label}</button>`).join("");
  links.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  applyTheme();
  const install=document.getElementById("installBtn");
  if(install)install.style.display=state.installPrompt?"grid":"none";
}
function setupInstallPrompt(){
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();state.installPrompt=e;renderDrawer();
  });
  window.addEventListener("appinstalled",()=>{state.installPrompt=null;renderDrawer();toast("Tubi berhasil dipasang di perangkat.");});
}
async function installApp(){
  if(!state.installPrompt){toast("Gunakan menu browser → Tambahkan ke layar utama jika tombol install belum tersedia.");return}
  state.installPrompt.prompt();
  try{await state.installPrompt.userChoice}catch{}
  state.installPrompt=null;renderDrawer();
}
function mapsUrl(lat,lng){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;
}
function mapsSearchUrl(address){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
}
function useCurrentLocation(targetId="checkoutAddress"){
  if(!navigator.geolocation){toast("Perangkat ini tidak mendukung lokasi.");return}
  toast("Meminta izin lokasi…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    state.location={lat:latitude,lng:longitude,url:mapsUrl(latitude,longitude)};
    const input=document.getElementById(targetId);
    if(input)input.value=`Lokasi saya (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
    const chip=document.getElementById("locationChip");
    if(chip)chip.innerHTML=`${svg("location",16)} Lokasi perangkat siap`;
    toast("Lokasi berhasil diambil.");
  },err=>{
    console.warn("Geolocation:",err);
    toast("Lokasi tidak tersedia. Izinkan akses lokasi lalu coba lagi.");
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function openMapsForAddress(address){
  if(!address)return;
  window.open(mapsSearchUrl(address),"_blank","noopener,noreferrer");
}
function confirmLogout(){
  if(window.confirm("Keluar dari akun Tubi? Kamu perlu login Google lagi untuk melihat pesanan dan profil."))logout();
}
function confirmClearCart(){
  if(window.confirm("Kosongkan semua isi keranjang?")){state.cart=[];saveLocal();renderCartModal();render();toast("Keranjang dikosongkan.");}
}
function render(){
  document.body.classList.toggle("dark",state.theme==="dark");
  const admin=!!isAdmin();
  const drawerAdmin=document.getElementById("drawerAdmin");
  if(drawerAdmin) drawerAdmin.style.display=admin?"block":"none";
  const visible=state.products.length?state.products:FALLBACK_PRODUCTS;
  const filtered=visible.filter(p=>(state.cat==="Semua"||p.category===state.cat)&&p.name.toLowerCase().includes(state.q.toLowerCase()));
  const root=$("#app");
  root.innerHTML=`
  <div class="shell">
    <div class="page">
      <div class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">${svg("menu",25)}</button>
        <div class="brand"><img src="./tubi-icon.png" alt="Tubi">tubi</div>
        <div class="top-actions">
          <button class="icon-btn cart-badge" id="cartBtn" aria-label="Keranjang">${svg("cart",24)}<i>${state.cart.reduce((a,x)=>a+x.qty,0)}</i></button>
        </div>
      </div>
      <div class="view ${state.view==="home"?"active":""}">
        <div class="hero"><div class="hero-copy"><div class="eyebrow">Selamat datang di</div><h1>Tubi</h1><p>Pesan makanan favoritmu dengan mudah, cepat, dan nyaman.</p><div class="hero-points"><span>Restoran pilihan</span><span>Pesanan real-time</span><span>Profil personal</span></div></div><div class="hero-art" aria-hidden="true"><span></span><span></span><span></span></div></div>
        <main>
          <div class="search-wrap"><div class="search"><span>${svg("search",21)}</span><input id="searchInput" value="${escapeHtml(state.q)}" placeholder="Lagi ngidam apa?"></div></div>
          <section class="section">
            <div class="section-head"><h2>Kategori</h2><button class="pill" id="allCats">Lihat semua</button></div>
            <div class="cats"><button class="cat ${state.cat==="Semua"?"active":""}" data-cat="Semua"><em>${svg("grid",28)}</em><strong>Semua</strong></button>${CATS.map(c=>`<button class="cat ${state.cat===c[1]?"active":""}" data-cat="${c[1]}"><em>${categoryIcon(c[1])}</em><strong>${c[1]}</strong></button>`).join("")}</div>
          </section>
          <section class="section">
            <div class="section-head"><h2>Produk pilihan</h2><span class="muted">${filtered.length} produk</span></div>
            ${filtered.length?`<div class="products">${filtered.map(productCard).join("")}</div>`:`<div class="empty">Produk tidak ditemukan.<br><button class="outline" style="margin-top:12px" id="resetSearch">Reset pencarian</button></div>`}
          </section>
          
        </main>
      </div>
      <div class="view ${state.view==="orders"?"active":""}">${ordersView()}</div>
      <div class="view ${state.view==="favorites"?"active":""}">${favoritesView()}</div>
      <div class="view ${state.view==="profile"?"active":""}">${profileView()}</div>
      ${admin&&state.view==="admin"?adminView():""}
    </div>
    <nav class="bottom-nav">
      ${nav("home","home","Beranda")}
      ${nav("orders","orders","Pesanan")}
      ${nav("favorites","heart","Favorit")}
      ${nav("profile","user","Akun")}
    </nav>
  </div>`;
  bind();
  renderDrawer();
  applyTheme();
}
function nav(v,icon,label){return `<button class="nav-btn ${state.view===v?"active":""}" data-view="${v}"><span>${svg(icon,21)}</span><small>${label}</small></button>`}
function loginCard(){
  if(state.user)return `<div class="login-card"><div class="user-mini"><img class="avatar" src="${state.user.photoURL||"/tubi-icon.png"}" alt=""><div><strong>${escapeHtml(state.user.displayName||"Pengguna Tubi")}</strong><small>${escapeHtml(state.user.email||"")}${isAdmin()?" · Admin":""}</small></div></div><button class="outline" id="profileBtn">Buka profil</button></div>`;
  return `<div class="login-card"><div><strong>Sudah punya akun?</strong><small class="muted" style="display:block;margin-top:5px">Masuk untuk menyimpan pesanan dan favorit.</small></div><button class="google" id="googleBtn">${googleIcon()} <span>Masuk dengan Google</span></button></div>`;
}
function productCard(p){
  const fav=state.favorites.includes(p.id);
  return `<article class="product">${imageHtml(p)}<div class="product-body"><button class="product-name-btn" data-detail="${p.id}" title="${escapeHtml(p.name)}"><h3>${escapeHtml(p.name)}</h3></button><small class="rating">★ ${p.rating||"5.0"} · Siap dipesan</small><small class="muted product-short-desc">${escapeHtml(p.description||"Favorit Tubi untuk kamu.")}</small><strong class="price">${rupiah(p.price)}</strong><div class="product-actions"><button class="heart ${fav?"active":""}" data-fav="${p.id}" aria-label="Favorit">${fav?"♥":"♡"}</button><button class="add" data-add="${p.id}">+ Tambah</button></div></div></article>`;
}
function ordersView(){
  return `<section class="section"><div class="section-head"><div><h2>Pesanan saya</h2><span class="muted">${state.user?"Riwayat pesanan akun ini":"Masuk untuk melihat pesanan"}</span></div><button class="outline" id="homeFromOrders">Beranda</button></div>${!state.user?`<div class="empty">Silakan masuk dengan Google untuk membuat dan melihat pesanan.<br><button class="google" id="googleBtn2" style="margin-top:13px">${googleIcon()} <span>Masuk dengan Google</span></button></div>`:state.orders.length?`<div class="orders">${state.orders.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(orderCard).join("")}</div>`:`<div class="empty">Belum ada pesanan.<br><button class="outline" id="shopNow" style="margin-top:12px">Mulai belanja</button></div>`}</section>`;

async function login(){
  try{
    toast("Menghubungkan ke Google…");
    await signInWithPopup(auth,google);
  }catch(e){
    console.error("Google login:",e);
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){
      try{ await signInWithRedirect(auth,google); return; }catch(er){ console.error(er); toast(authMessage(er)); return; }
    }
    if(e.code==="auth/popup-closed-by-user"){ toast("Login dibatalkan."); return; }
    toast(authMessage(e));
  }
}
function authMessage(e){
  const m=e?.code||"";
  if(m==="auth/unauthorized-domain")return "Domain Vercel belum diizinkan Firebase. Tambahkan domain yang sedang dibuka di Authentication → Settings → Authorized domains.";
  if(m==="auth/popup-closed-by-user")return "Login dibatalkan.";
  if(m==="auth/operation-not-allowed")return "Google Sign-In belum diaktifkan di Firebase Authentication.";
  if(m==="auth/invalid-api-key")return "Firebase API key tidak valid.";
  if(m==="auth/network-request-failed")return "Koneksi ke Firebase gagal. Coba lagi.";
  return "Login Google gagal. Pastikan domain Vercel sudah ada di Authorized domains Firebase.";
}
async function afterLogin(user){
  state.user=user;
  const email=normalizedEmail(user.email);
  let snap=null, adminDoc=null, adminDocExact=null;
  try{ snap=await getDoc(doc(db,"users",user.uid)); }catch(e){ console.warn("User profile read:",e); }
  try{ adminDoc=await getDoc(doc(db,"admins",email)); }catch(e){ console.warn("Admin list read:",e); }
  try{ adminDocExact=await getDoc(doc(db,"admins",user.email||"")); }catch(e){ console.warn("Admin exact read:",e); }
  const fixed=emailIsFixedAdmin(user.email);
  const listed=!!adminDoc?.exists() || !!adminDocExact?.exists();
  const role=(fixed||listed)?"admin":"customer";
  state.profile={...(snap?.data()||{}),uid:user.uid,email:user.email||"",displayName:(snap?.data()?.displayName||user.displayName||"Pengguna Tubi"),photoURL:(snap?.data()?.photoURL||user.photoURL||""),recipientName:(snap?.data()?.recipientName||snap?.data()?.displayName||user.displayName||"Pengguna Tubi"),role};
  state.isAdmin=role==="admin";
  if(state.isAdmin) await setDoc(doc(db,"admins",email),{email:user.email||email,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
  await setDoc(doc(db,"users",user.uid),{uid:user.uid,email:user.email||"",displayName:state.profile.displayName,photoURL:state.profile.photoURL||"",recipientName:state.profile.recipientName||state.profile.displayName,role,lastLogin:serverTimestamp()},{merge:true}).catch(()=>{});
  state.adminEmails=state.isAdmin?await loadAdminEmails():[];
  subscribeOrders();
  state.view=state.isAdmin?"admin":"profile";
  render();
  toast(state.isAdmin?"Login admin berhasil. Dashboard Admin dibuka.":"Selamat datang di Tubi!");
}
async function loadAdminEmails(){
  try{
    const snap=await getDocs(collection(db,"admins"));
    const list=snap.docs.map(d=>d.data()?.email||d.id).filter(Boolean);
    return [...new Set([ADMIN_EMAIL,...list])].sort((a,b)=>a.localeCompare(b));
  }catch(e){console.warn("Admin list:",e);return [ADMIN_EMAIL];}
}
function subscribeProducts(){
  state.productsUnsub?.();
  state.productsUnsub=onSnapshot(collection(db,"products"),snap=>{
    state.products=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!state.products.length)state.products=[];
    render();
  },err=>{console.error(err);state.products=[];render()});
}
function subscribeOrders(){
  state.ordersUnsub?.();
  if(!state.user)return;
  if(state.isAdmin){
    state.adminOrdersUnsub?.();
    state.adminOrdersUnsub=onSnapshot(collection(db,"orders"),snap=>{state.orders=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>console.error(err));
  }else{
    const qy=query(collection(db,"orders"),where("userId","==",state.user.uid));
    state.ordersUnsub=onSnapshot(qy,snap=>{state.orders=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>console.error(err));
  }
}

      state.profile={...(state.profile||{}),address:addr,note:$("#checkoutNote").value.trim(),recipientName:recipientName,phone:phone};

  };

async function compressImage(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.68))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
}
async function saveProduct(form){
  const fd=new FormData(form);const data={name:String(fd.get("name")).trim(),price:Number(fd.get("price")),category:String(fd.get("category")),rating:Number(fd.get("rating"))||5,emoji:String(fd.get("emoji")||"Tubi").trim()||"Tubi",description:String(fd.get("description")||"").trim()};
  const file=$("#productImage")?.files?.[0];
  if(file)data.image=await compressImage(file);else if(state.editingProduct)data.image=state.editingProduct.image||"";
  if(!data.name||data.price<0){toast("Lengkapi nama dan harga.");return}
  try{
    if(state.editingProduct)await updateDoc(doc(db,"products",state.editingProduct.id),data);
    else await addDoc(collection(db,"products"),data);
    state.editingProduct=null;render();toast("Produk berhasil disimpan.");
  }catch(e){console.error(e);toast("Gagal menyimpan produk. Cek Firestore Rules.");}
}
async function seed(){
  if(!window.confirm("Buat katalog produk awal Tubi sekarang?"))return;
  try{for(const p of FALLBACK_PRODUCTS){const {id,...data}=p;await setDoc(doc(db,"products",id),data)}toast("Produk awal berhasil dibuat.")}catch(e){console.error(e);toast("Gagal membuat produk awal.")}
}
async function removeProduct(id){
  if(!confirm("Hapus produk ini?"))return;
  try{await deleteDoc(doc(db,"products",id));toast("Produk dihapus.")}catch(e){console.error(e);toast("Gagal menghapus produk.")}
}
async function changeOrderStatus(id,status){
  try{await updateDoc(doc(db,"orders",id),{status});toast("Status pesanan diperbarui.")}catch(e){console.error(e);toast("Gagal memperbarui status.")}
}

async function addAdmin(input){
  const raw=String(input||"").trim();
  const email=normalizedEmail(raw);
  if(!email || !email.includes("@")){toast("Masukkan email admin yang valid.");return}
  try{
    await setDoc(doc(db,"admins",email),{email:raw,addedBy:state.user.email||"",createdAt:serverTimestamp()},{merge:true});
    if(raw!==email) await setDoc(doc(db,"admins",raw),{email:raw,addedBy:state.user.email||"",createdAt:serverTimestamp()},{merge:true});
    state.adminEmails=await loadAdminEmails();render();toast("Admin berhasil ditambahkan.");
  }catch(e){console.error(e);toast("Gagal menambahkan admin. Pastikan kamu login sebagai admin.");}
}
async function removeAdmin(input){
  const raw=String(input||"").trim();
  const email=normalizedEmail(raw);
  if(email===normalizedEmail(ADMIN_EMAIL)){toast("Admin utama tidak bisa dihapus.");return}
  if(!confirm(`Hapus akses admin untuk ${raw}?`))return;
  try{
    await deleteDoc(doc(db,"admins",email));
    if(raw!==email) await deleteDoc(doc(db,"admins",raw)).catch(()=>{});
    state.adminEmails=await loadAdminEmails();render();toast("Akses admin dihapus.");
  }catch(e){console.error(e);toast("Gagal menghapus admin.");}
}
async function saveProfile(){
  if(!state.user)return;
  const name=$("#profileName").value.trim()||"Pengguna Tubi";
  const phone=$("#profilePhone").value.trim();
  const recipientName=name;
  const address=$("#profileAddress").value.trim();
  const bio=$("#profileBio").value.trim();
  state.profileSaving=true;render();
  try{
    await updateProfile(state.user,{displayName:name});
    await setDoc(doc(db,"users",state.user.uid),{displayName:name,phone,address,bio,recipientName,email:state.user.email||""},{merge:true});
    state.profile={...(state.profile||{}),displayName:name,phone,address,bio,recipientName};
    state.profileSaving=false;render();toast("Profil berhasil diperbarui.");
  }catch(e){console.error(e);state.profileSaving=false;render();toast("Profil gagal disimpan. Coba lagi.");}
}
async function saveProfilePhoto(file){
  if(!file||!state.user)return;
  try{
    const data=await compressImage(file);
    await setDoc(doc(db,"users",state.user.uid),{photoURL:data},{merge:true});
    state.profile={...(state.profile||{}),photoURL:data};render();toast("Foto profil diperbarui.");
  }catch(e){console.error(e);toast("Foto profil gagal disimpan.");}
}
function setView(v){if(v==="admin"&&!isAdmin()){toast("Akses admin ditolak.");return}state.view=v;$("#drawer").classList.remove("open");$("#drawerBackdrop").classList.remove("open");render();window.scrollTo({top:0,behavior:"smooth"})}
function bind(){
  $("#menuBtn").onclick=()=>{$("#drawer").classList.add("open");$("#drawerBackdrop").classList.add("open")};
  $("#closeDrawer").onclick=()=>{$("#drawer").classList.remove("open");$("#drawerBackdrop").classList.remove("open")};
  $("#drawerBackdrop").onclick=()=>{$("#drawer").classList.remove("open");$("#drawerBackdrop").classList.remove("open")};
  $("#cartBtn").onclick=openCart;
  $("#themeToggle")?.addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";applyTheme();});
  $("#installBtn")?.addEventListener("click",installApp);
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $("#searchInput")?.addEventListener("input",e=>{state.q=e.target.value;render();const input=$("#searchInput");input?.focus();input?.setSelectionRange(state.q.length,state.q.length)});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()});
  $("#allCats")?.addEventListener("click",()=>{state.cat="Semua";render()});
  $("#resetSearch")?.addEventListener("click",()=>{state.q="";render()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
  document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>openProductDetail(b.dataset.detail));
  $("#googleBtn")?.addEventListener("click",login);$("#googleBtn2")?.addEventListener("click",login);$("#googleBtn3")?.addEventListener("click",login);
  $("#profileBtn")?.addEventListener("click",()=>setView("profile"));$("#homeFromOrders")?.addEventListener("click",()=>setView("home"));$("#shopNow")?.addEventListener("click",()=>setView("home"));
  $("#logoutBtn")?.addEventListener("click",confirmLogout);$("#myOrdersBtn")?.addEventListener("click",()=>setView("orders"));$("#myFavBtn")?.addEventListener("click",()=>setView("favorites"));$("#adminBtn")?.addEventListener("click",()=>setView("admin"));$("#adminHome")?.addEventListener("click",()=>setView("home"));
  $("#saveProfile")?.addEventListener("click",saveProfile);
  $("#installProfile")?.addEventListener("click",installApp);
  $("#profilePhoto")?.addEventListener("change",e=>saveProfilePhoto(e.target.files?.[0]));
  $("#profileLocation")?.addEventListener("click",()=>useCurrentLocation("profileAddress"));
  $("#profileMap")?.addEventListener("click",()=>openMapsForAddress($("#profileAddress")?.value.trim()));
  $("#adminForm")?.addEventListener("submit",e=>{e.preventDefault();addAdmin($("#newAdminEmail").value)});
  document.querySelectorAll("[data-remove-admin]").forEach(b=>b.onclick=()=>removeAdmin(b.dataset.removeAdmin));
  $("#productForm")?.addEventListener("submit",async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Menyimpan';await saveProduct(e.target);});
  $("#cancelEdit")?.addEventListener("click",()=>{state.editingProduct=null;render()});
  $("#seedBtn")?.addEventListener("click",seed);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.editingProduct=state.products.find(p=>p.id===b.dataset.edit);render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeProduct(b.dataset.delete));
  document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>changeOrderStatus(s.dataset.status,s.value));
}
setupInstallPrompt();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Tubi SW:", err))); }
onAuthStateChanged(auth,user=>{if(user){afterLogin(user).catch(e=>{console.error(e);state.user=user;state.isAdmin=emailIsFixedAdmin(user.email);state.adminEmails=state.isAdmin?[ADMIN_EMAIL]:[];subscribeOrders();render()})}else{state.user=null;state.profile=null;state.isAdmin=false;state.orders=[];render()}});
getRedirectResult(auth).catch(e=>{if(e?.code)console.warn("Redirect:",e.code)});
subscribeProducts();
render();
</script>
</body>
</html>
