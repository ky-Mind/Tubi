<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="description" content="Tubi — aplikasi pemesanan makanan.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tubi">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>Tubi</title>
<style>
:root{--brand:#d7192f;--brand2:#f04a59;--cream:#f7f4ee;--bg:#f5f6f8;--card:#fff;--text:#171717;--muted:#73777f;--line:#e7e8eb;--soft:#fff1f3;--success:#15803d;--warning:#b45309;--danger:#b91c1c;--shadow:0 12px 34px rgba(18,22,33,.08);--radius:22px}
html[data-theme=dark]{--cream:#151515;--bg:#0f1114;--card:#17191d;--text:#f5f6f7;--muted:#a8adb6;--line:#292d33;--soft:#30161b;--shadow:0 18px 40px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
#app{min-height:100vh}.app{min-height:100vh}.topbar{height:74px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px max(18px,calc((100vw - 1240px)/2));position:sticky;top:0;z-index:50}.brand{border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;letter-spacing:-1.2px}.brand img{width:44px;height:44px}.brand-copy{display:grid;line-height:1}.brand-copy small{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.2px;margin-top:4px}.spacer{flex:1}
.icon-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;display:grid;place-items:center;position:relative}.icon-btn svg,.nav-icon svg{width:21px;height:21px}.badge{position:absolute;right:-4px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#111;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
.desktop-nav{display:none}.main{max-width:1240px;margin:auto;padding:0 18px 112px}.hero{margin:0 calc(50% - 50vw);background:linear-gradient(135deg,var(--brand),#b80d22);color:#fff;padding:46px max(18px,calc((100vw - 1240px)/2)) 76px;position:relative;overflow:hidden}.hero:after,.hero:before{content:"";position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}.hero:before{width:390px;height:390px;right:-130px;top:-180px}.hero:after{width:240px;height:240px;right:-30px;bottom:-150px}.hero-content{position:relative;z-index:2}.eyebrow{font-size:13px;font-weight:800;opacity:.84}.hero h1{font-size:clamp(40px,7vw,72px);margin:6px 0 8px;letter-spacing:-3px}.hero p{max-width:620px;margin:0;font-size:16px;opacity:.92}.search-wrap{max-width:850px;margin:-28px auto 0;position:relative;z-index:10}.search{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;display:flex;align-items:center;gap:10px;padding:4px 14px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:13px 0}
.section{margin:28px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.5px}.muted{color:var(--muted)}.link{border:0;background:transparent;color:var(--brand);font-weight:800}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.category{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:17px 12px;min-height:92px;text-align:center;transition:.18s}.category:hover,.category.active{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:var(--soft)}.category-icon{width:42px;height:42px;border-radius:14px;margin:0 auto 7px;background:var(--soft);display:grid;place-items:center;color:var(--brand)}.category b{font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:14px;min-width:0;box-shadow:0 4px 14px rgba(18,22,33,.03)}.product-photo{width:124px;height:124px;flex:0 0 124px;border-radius:16px;background:var(--cream);object-fit:cover;display:grid;place-items:center;overflow:hidden}.product-photo img{width:100%;height:100%;object-fit:cover}.placeholder-photo{color:var(--muted)}.product-info{min-width:0;flex:1}.product-info h3{margin:2px 0 6px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rating{font-size:12px;margin:8px 0;color:#b45309}.price{font-size:17px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s}.btn:active{transform:scale(.98)}.btn-primary{background:var(--brand);color:#fff}.btn-soft{background:var(--soft);color:var(--brand)}.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn-danger{background:#fee2e2;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 5px 18px rgba(18,22,33,.03)}.empty{text-align:center;padding:46px 20px}.empty .empty-icon{width:58px;height:58px;border-radius:18px;margin:0 auto 12px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));}.nav-item{border:0;background:transparent;color:var(--muted);padding:6px 4px;display:grid;place-items:center;gap:4px;font-size:11px}.nav-item.active{color:var(--brand);font-weight:900}.nav-icon{height:23px;display:grid;place-items:center}
.drawer-back,.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100}.drawer{width:min(380px,90vw);height:100%;background:var(--card);padding:18px;overflow:auto;box-shadow:24px 0 70px rgba(0,0,0,.22)}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer-list{display:grid;gap:6px;margin-top:20px}.drawer-item{width:100%;border:0;background:transparent;color:var(--text);border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left}.drawer-item:hover{background:var(--soft)}.drawer-item svg{width:20px;height:20px}.drawer-user{padding:14px;border:1px solid var(--line);border-radius:18px;margin-top:16px;display:flex;align-items:center;gap:12px}.avatar-sm{width:42px;height:42px;border-radius:14px;object-fit:cover;background:var(--cream);display:grid;place-items:center;overflow:hidden}.avatar-sm img{width:100%;height:100%;object-fit:cover}
.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 18px}.page-title h1{margin:0;font-size:28px;letter-spacing:-1px}.profile-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.profile-card{text-align:center}.avatar-lg{width:112px;height:112px;border-radius:30px;background:var(--cream);margin:4px auto 14px;overflow:hidden;display:grid;place-items:center}.avatar-lg img{width:100%;height:100%;object-fit:cover}.profile-name{font-size:25px;font-weight:900;margin:0}.profile-email{margin:5px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.order-list{display:grid;gap:12px}.order-head,.order-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.order-row{padding:9px 0}.order-status{font-size:11px;font-weight:900;border-radius:999px;padding:7px 10px;background:#dcfce7;color:var(--success)}.order-status.pending{background:#fef3c7;color:var(--warning)}.order-status.cancelled{background:#fee2e2;color:var(--danger)}.order-items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0;padding:7px 0}.location-box{background:var(--soft);border-radius:15px;padding:12px;margin-top:12px}.location-box b{display:block;margin-bottom:4px}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:4px}.admin-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}.admin-products{display:grid;gap:10px}.admin-product{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.admin-product img{width:70px;height:70px;border-radius:14px;object-fit:cover;background:var(--cream)}.admin-product-info{min-width:0;flex:1}.admin-product-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-back{display:grid;place-items:center;padding:18px}.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.modal h2{margin:0 0 5px}.form-grid{display:grid;gap:13px}.field label{display:block;font-size:12px;font-weight:850;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--bg);color:var(--text);outline:0}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:150;background:#171717;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.25);max-width:min(92vw,520px);text-align:center}
.install-banner{position:fixed;left:14px;right:14px;bottom:84px;z-index:70;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px}.install-banner .copy{flex:1;font-size:13px}.install-banner .copy b{display:block;margin-bottom:3px}.install-banner .copy span{color:var(--muted)}
@media(min-width:900px){.desktop-nav{display:flex;align-items:center;gap:4px;margin-left:18px}.desktop-nav button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:10px 12px;border-radius:12px}.desktop-nav button.active,.desktop-nav button:hover{background:var(--soft);color:var(--brand)}.bottom-nav{display:none}.main{padding-bottom:60px}.topbar .menu-mobile{display:none}}
@media(max-width:899px){.profile-grid,.admin-grid{grid-template-columns:1fr}.admin-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.products{grid-template-columns:1fr}.categories{grid-template-columns:repeat(2,1fr)}.product-photo{width:96px;height:96px;flex-basis:96px}.topbar{height:66px;padding-inline:12px}.brand{font-size:22px}.brand img{width:40px;height:40px}.hero{padding-top:34px}.page-title{align-items:flex-start}.page-title h1{font-size:25px}.two-col{grid-template-columns:1fr}}
@media(max-width:430px){.product{padding:10px;gap:10px}.product-photo{width:86px;height:86px;flex-basis:86px}.product-info h3{font-size:15px}.price{font-size:15px}.btn{padding:9px 11px}.admin-stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
