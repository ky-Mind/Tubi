const IMAGE_FALLBACKS={
  "roti kukus thailand":"./assets/roti-kukus.png",
  "topokki sosis & odeng":"./assets/topokki.png",
  "cilok dan tahu":"./assets/cilok.png",

function resolveImageSrc(value,p){
  let src=String(value||"").trim();
  if(!src)src=IMAGE_FALLBACKS[normalizeSearch(p?.name)]||"";
  if(src.startsWith("assets/"))src="./"+src;
  if(src.startsWith("public/"))src="./"+src.slice(7);
  return /^(data:image|https?:\/\/|\.\/|\/)/.test(src)?src:"";
}
function imageHtml(p,cls="product-img"){
  const src=resolveImageSrc(p?.image,p);
  const fallback=IMAGE_FALLBACKS[normalizeSearch(p?.name)]||"";
  const safeFallback=escapeHtml(fallback);
  return `<div class="${cls}">${src?`<img src="${escapeHtml(src)}" alt="${escapeHtml(p.name)}" loading="lazy" data-fallback="${safeFallback}" onerror="if(this.dataset.fallback && this.src!==new URL(this.dataset.fallback,location.href).href){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'product-emoji'}));this.parentElement.querySelector('.product-emoji').innerHTML='${svg("image",52)}'}">`:`<span class="product-emoji">${svg("image",52)}</span>`}</div>`;
}
function statusClass(s){return String(s||"baru").toLowerCase().replace(/\s/g,"-")}
function timeText(ts){if(!ts)return "Baru saja";try{return new Intl.DateTimeFormat("id-ID",{dateStyle:"medium",timeStyle:"short"}).format(ts.toDate())}catch{return "Baru saja"}}

  localStorage.setItem("tubi_theme",state.theme);

function mapsUrl(lat,lng){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;
}
function mapsSearchUrl(address){

}
function useCurrentLocation(targetId="checkoutAddress"){
  if(!navigator.geolocation){toast("Perangkat ini tidak mendukung lokasi.");return}
  toast("Meminta izin lokasi…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    state.location={lat:latitude,lng:longitude,url:mapsUrl(latitude,longitude)};
    const input=document.getElementById(targetId);
    if(input)input.value=`Lokasi saya (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
    const chip=document.getElementById("locationChip");
    if(chip)chip.innerHTML=`${svg("location",16)} Lokasi perangkat siap`;
    toast("Lokasi berhasil diambil.");
  },err=>{
    console.warn("Geolocation:",err);
    toast("Lokasi tidak tersedia. Izinkan akses lokasi lalu coba lagi.");
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function openMapsForAddress(address){

function periodRevenue(days){
  const cutoff=Date.now()-days*86400000;
  return (state.orders||[]).filter(o=>displayStatus(o.status)==="selesai" && o.createdAt?.toDate && o.createdAt.toDate().getTime()>=cutoff).reduce((a,o)=>a+Number(o.total||0),0);
}
function revenueChartHtml(){
  const days=[]; for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const next=new Date(d);next.setDate(next.getDate()+1);const val=(state.orders||[]).filter(o=>displayStatus(o.status)==="selesai"&&o.createdAt?.toDate&&o.createdAt.toDate()>=d&&o.createdAt.toDate()<next).reduce((a,o)=>a+Number(o.total||0),0);days.push({d,val});}
  const max=Math.max(1,...days.map(x=>x.val)); return `<div class="chart-bars">${days.map(x=>`<div style="flex:1;text-align:center"><div class="chart-bar" style="height:${Math.max(6,Math.round(x.val/max*120))}px" title="${rupiah(x.val)}"></div><div class="chart-label">${x.d.getDate()}/${x.d.getMonth()+1}</div></div>`).join("")}</div>`;
}
function topProductsHtml(){
  const map={}; (state.orders||[]).filter(o=>displayStatus(o.status)==="selesai").forEach(o=>(o.items||[]).forEach(i=>{map[i.id||i.name]=(map[i.id||i.name]||0)+Number(i.qty||0)}));
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return rows.length?rows.map((r,i)=>`<div class="notice-row"><span>${i+1}. ${escapeHtml((state.products.find(p=>p.id===r[0])?.name)||r[0])}</span><strong>${r[1]} terjual</strong></div>`).join(""):`<div class="empty">Belum ada transaksi selesai.</div>`;
}
function notificationHtml(n){

async function loadAdminExtras(){

function whatsappUrl(){
  const n=String(state.storeSettings?.whatsapp||"").replace(/\D/g,"");

}

function whatsappDisplay(){
  const n=whatsappNumber();
  if(!n)return "Nomor WhatsApp admin belum diatur.";
  const local=n.startsWith("62")?"0"+n.slice(2):n;

function printOrder(o){

function authMessage(e){
  const m=e?.code||"";
  if(m==="auth/unauthorized-domain")return "Domain Vercel belum diizinkan Firebase. Tambahkan domain yang sedang dibuka di Authentication → Settings → Authorized domains.";
  if(m==="auth/popup-closed-by-user")return "Login dibatalkan.";
  if(m==="auth/operation-not-allowed")return "Google Sign-In belum diaktifkan di Firebase Authentication.";
  if(m==="auth/invalid-api-key")return "Firebase API key tidak valid.";
  if(m==="auth/network-request-failed")return "Koneksi ke Firebase gagal. Coba lagi.";
  return "Login Google gagal. Pastikan domain Vercel sudah ada di Authorized domains Firebase.";
}

async function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error("File gambar tidak ada."));return}
    if(!/^image\\//i.test(file.type||"")){reject(new Error("File harus berupa gambar."));return}
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          // Firebase Spark: simpan foto langsung sebagai data URL di Firestore.
          // Ukuran dibatasi agar tetap jauh di bawah batas dokumen Firestore 1 MiB.
          const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
          const ctx=c.getContext("2d",{alpha:false});
          if(!ctx){reject(new Error("Canvas tidak tersedia."));return}
          ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
          const dataUrl=c.toDataURL("image/jpeg",.68);
          // Guard sederhana supaya satu field gambar tidak mendekati batas dokumen.
          if(dataUrl.length>850000){reject(new Error("Foto terlalu besar setelah dikompres. Pilih foto yang lebih kecil."));return}
          resolve(dataUrl);
        }catch(e){reject(e)}
      };
      img.onerror=()=>reject(new Error("File gambar tidak dapat dibaca."));
      img.src=r.result;
    };
    r.onerror=()=>reject(new Error("File gambar tidak dapat dibaca."));
    r.readAsDataURL(file);
  });
}
async function imageForFirestore(file){
  return await compressImage(file);
}

  const attributes=String(fd.get("attributes")||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,15);

  const data={name:String(fd.get("name")).trim(),price:Number(fd.get("price")),category:String(fd.get("category")),attributes,tags:attributes.map(x=>x.toLowerCase()),rating:Number(fd.get("rating"))||5,emoji:"Tubi",description:String(fd.get("description")||"").trim(),available:availability!=="habis",availability};

        throw uploadErr;

    state.editingProduct=null;render();toast("Produk berhasil disimpan.");
  }catch(e){

    const msg=e?.code==="permission-denied"?"Produk ditolak Firestore. Pasang Firestore Rules terbaru.":(e?.message||"Produk gagal disimpan. Periksa koneksi Firebase.");

function setUiLock(locked){
  const shouldLock=!!locked;
  const body=document.body, app=document.getElementById("app");
  if(shouldLock && !body.classList.contains("ui-locked")){
    window.__tubiScrollY=window.scrollY||window.pageYOffset||0;
    body.style.position="fixed";
    body.style.top=`-${window.__tubiScrollY}px`;
    body.style.left="0";
    body.style.right="0";
    body.style.width="100%";
  }
  document.documentElement.classList.toggle("ui-locked",shouldLock);
  body.classList.toggle("ui-locked",shouldLock);
  if(app){
    app.inert=shouldLock;
    app.setAttribute("aria-hidden",shouldLock?"true":"false");
  }
  if(!shouldLock && body.style.position==="fixed"){
    const y=window.__tubiScrollY||0;
    body.style.position="";body.style.top="";body.style.left="";body.style.right="";body.style.width="";
    window.scrollTo(0,y);
  }
}
function closeDrawer(){
  $("#drawer")?.classList.remove("open"); $("#drawerBackdrop")?.classList.remove("open");
  setUiLock(false);
}
function closeOverlay(id){
  $("#"+id)?.classList.remove("open");
  const anyOpen=[...document.querySelectorAll(".drawer-backdrop.open,.modal-backdrop.open")].length>0;
  setUiLock(anyOpen);
}
function openOverlay(id){
  $("#"+id)?.classList.add("open"); setUiLock(true);
}

function setView(v){
  if(v==="admin"&&!isAdmin()){toast("Akses admin ditolak.");return}
  state.view=v; closeDrawer(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function bind(){
  $("#menuBtn").onclick=()=>{ $("#drawer").classList.add("open"); $("#drawerBackdrop").classList.add("open"); setUiLock(true); };
  $("#closeDrawer").onclick=closeDrawer;
  $("#drawerBackdrop").onclick=closeDrawer;
  $("#cartBtn").onclick=openCart;
  $("#themeToggle")?.addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";applyTheme();});
  $("#installBtn")?.addEventListener("click",installApp);
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $("#searchInput")?.addEventListener("input",e=>{state.q=e.target.value;render();const input=$("#searchInput");input?.focus();input?.setSelectionRange(state.q.length,state.q.length)});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()});
  $("#allCats")?.addEventListener("click",()=>{state.cat="Semua";render()});
  $("#resetSearch")?.addEventListener("click",()=>{state.q="";render()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
  document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>openProductDetail(b.dataset.detail));
  $("#googleBtn")?.addEventListener("click",login);$("#googleBtn2")?.addEventListener("click",login);$("#googleBtn3")?.addEventListener("click",login);
  $("#profileBtn")?.addEventListener("click",()=>setView("profile"));$("#homeFromOrders")?.addEventListener("click",()=>setView("home"));$("#shopNow")?.addEventListener("click",()=>setView("home"));
  $("#logoutBtn")?.addEventListener("click",confirmLogout);$("#myOrdersBtn")?.addEventListener("click",()=>setView("orders"));$("#myFavBtn")?.addEventListener("click",()=>setView("favorites"));$("#adminBtn")?.addEventListener("click",()=>setView("admin"));$("#adminHome")?.addEventListener("click",()=>setView("home"));
  $("#saveProfile")?.addEventListener("click",saveProfile);
  $("#installProfile")?.addEventListener("click",installApp);
  $("#profilePhoto")?.addEventListener("change",e=>saveProfilePhoto(e.target.files?.[0]));
  $("#profileLocation")?.addEventListener("click",()=>useCurrentLocation("profileAddress"));
  $("#profileMap")?.addEventListener("click",()=>openMapsForAddress($("#profileAddress")?.value.trim()));
  $("#profileWhatsApp")?.addEventListener("click",openAdminWhatsApp);
  $("#profileThemeToggle")?.addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";saveLocal();applyTheme();render();});
  $("#adminForm")?.addEventListener("submit",e=>{e.preventDefault();addAdmin($("#newAdminEmail").value)});
  document.querySelectorAll("[data-remove-admin]").forEach(b=>b.onclick=()=>removeAdmin(b.dataset.removeAdmin));
  $("#productForm")?.addEventListener("submit",async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Menyimpan';await saveProduct(e.target);});
  $("#cancelEdit")?.addEventListener("click",()=>{state.editingProduct=null;render()});
  $("#seedBtn")?.addEventListener("click",seed);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.editingProduct=state.products.find(p=>p.id===b.dataset.edit);render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeProduct(b.dataset.delete));
  document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>changeOrderStatus(s.dataset.status,s.value));
  document.querySelectorAll("[data-cancel-order]").forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cancelOrder));
  document.querySelectorAll("[data-review-order]").forEach(b=>b.onclick=()=>reviewOrder(b.dataset.reviewOrder));
  document.querySelectorAll("[data-print-order]").forEach(b=>b.onclick=()=>{const o=state.orders.find(x=>x.id===b.dataset.printOrder);if(o)printOrder(o);});
  document.querySelectorAll("[data-admin-tab]").forEach(b=>b.onclick=()=>{
    const tab=b.dataset.adminTab;
    document.querySelectorAll("[data-admin-tab]").forEach(x=>x.classList.toggle("active",x===b));
    document.querySelectorAll("[data-admin-panel]").forEach(p=>p.hidden=p.dataset.adminPanel!==tab);
  });
  document.querySelectorAll("[data-admin-jump]").forEach(b=>b.onclick=()=>document.querySelector(`[data-admin-tab="${b.dataset.adminJump}"]`)?.click());
  document.querySelectorAll("[data-read-notification]").forEach(b=>b.onclick=()=>markNotification(b.dataset.readNotification));
  $("#readAllNotifications")?.addEventListener("click",readAllNotifications);
  document.querySelectorAll("[data-bug-status]").forEach(s=>s.onchange=()=>changeBugStatus(s.dataset.bugStatus,s.value));
  $("#submitBug")?.addEventListener("click",submitBug);
  $("#whatsappForm")?.addEventListener("submit",e=>{e.preventDefault();saveStoreSettings(e.target)});
  $("#printerConnect")?.addEventListener("click",connectPrinter);
  $("#printerTest")?.addEventListener("click",testPrinter);
  $("#printerDisconnect")?.addEventListener("click",()=>{state.printer.connected=false;localStorage.setItem("tubi_printer",JSON.stringify(state.printer));render();toast("Printer diputuskan.")});
  $("#autoPrint")?.addEventListener("change",e=>{state.printer.auto=e.target.checked;localStorage.setItem("tubi_printer",JSON.stringify(state.printer));});
  document.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>{
    const input=$("#adminCalc"); if(!input)return;
    if(b.dataset.calc==="="){try{input.value=String(Function('"use strict";return ('+input.value.replace(/[^0-9+\-*/(). ]/g,"")+')')())}catch{input.value="Error"}}else input.value+=b.dataset.calc;
  });
  $("#calcClear")?.addEventListener("click",()=>{if($("#adminCalc"))$("#adminCalc").value=""});
}
["cartBackdrop","productBackdrop","loginBackdrop"].forEach(id=>{
  const el=document.getElementById(id);
  el?.addEventListener("click",e=>{if(e.target===el)closeOverlay(id)});
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if($("#drawer")?.classList.contains("open")) closeDrawer();
  ["cartBackdrop","productBackdrop","loginBackdrop"].forEach(closeOverlay);
});
setupInstallPrompt();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      await reg.update();
      if(reg.waiting){
        showUpdateBanner(reg);
      }
      reg.addEventListener("updatefound",()=>{
        const installing=reg.installing;
        installing?.addEventListener("statechange",()=>{
          if(installing.state==="installed" && navigator.serviceWorker.controller) showUpdateBanner(reg);
        });
      });
    }catch(err){console.warn("Tubi SW:",err)}
  });
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible")navigator.serviceWorker.getRegistration("./sw.js").then(r=>r?.update()).catch(()=>{});
  });
}
onAuthStateChanged(auth,user=>{if(user){afterLogin(user).catch(e=>{console.error(e);state.user=user;state.isAdmin=emailIsFixedAdmin(user.email);state.adminEmails=state.isAdmin?[ADMIN_EMAIL]:[];if(state.isAdmin)loadAdminExtras().then(()=>render());subscribeOrders();render()})}else{state.user=null;state.profile=null;state.isAdmin=false;state.orders=[];render()}});
getRedirectResult(auth).catch(e=>{if(e?.code)console.warn("Redirect:",e.code)});
subscribeStoreSettings();
subscribeProducts();
const initialView=new URLSearchParams(location.search).get("view");
if(["home","orders","favorites","profile"].includes(initialView))state.view=initialView;
render();
</script>
